<ActionBar title="Buscar personas">
  <NavigationButton text="Volver" android.systemIcon="ic_menu_back" (tap)="volver()"></NavigationButton>
  <ActionItem text="Limpiar" ios.position="right" (tap)="limpiar()"></ActionItem>
</ActionBar>
<GridLayout rows="auto, auto, auto, *" class="pagina">
  <!-- Two way binding: lo escrito actualiza `consulta` y viceversa -->
  <SearchBar row="0" hint="Nombre, correo o subárea" [(ngModel)]="consulta" (ngModelChange)="filtrar($event)" class="barra-busqueda"></SearchBar>

  <!-- Chips de categoría dentro de un FlexboxLayout que salta de línea si no caben -->
  <FlexboxLayout row="1" flexWrap="wrap" class="filtros">
    <Label *ngFor="let filtro of filtros" [text]="filtro" class="chip chip-filtro" [class.chip-filtro-activo]="filtro === filtroActivo" (tap)="elegirFiltro(filtro)"></Label>
  </FlexboxLayout>

  <Label row="2" [text]="resultados.length + ' resultado(s)'" class="aviso-vista contenedor"></Label>

  <ListView row="3" [items]="resultados" (itemTap)="verDetalle($any($event))" class="lista" separatorColor="transparent">
    <ng-template let-persona="item">
      <!-- Plantilla del ListView con un FlexboxLayout anidado -->
      <FlexboxLayout class="tarjeta fila-resultado" flexDirection="row" flexWrap="wrap" alignItems="center" justifyContent="space-between">
        <Label [text]="persona.nombre" class="nombre" flexGrow="1" textWrap="true"></Label>
        <Label [text]="persona.subarea" class="chip"></Label>
        <Label [text]="persona.categoria" class="chip chip-acento"></Label>
        <Label [text]="persona.correo" class="dato" flexWrapBefore="true" flexGrow="1"></Label>
        <Label *ngIf="persona.favorito" class="fas icono-fav-activo" text="&#xf005;"></Label>
      </FlexboxLayout>
    </ng-template>
  </ListView>
</GridLayout>
